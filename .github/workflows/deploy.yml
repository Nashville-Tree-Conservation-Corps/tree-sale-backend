name: deploy-api
on:
  push:
    branches: [main]
permissions:
  contents: read
  id-token: write
concurrency:
  group: deploy-api
  cancel-in-progress: false
jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: |
          JWT=$(curl -s -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.googleapis.com" | jq -r .value)
          echo "$JWT" | cut -d. -f2 | base64 -d 2>/dev/null | jq '{sub, repository, ref, environment}' || true
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - run: gcloud auth print-access-token >/dev/null && echo GCLOUD_TOKEN_OK
      - run: |
          npx firebase-tools deploy --only functions --force --non-interactive --debug 2>&1 | grep -viE 'authorization. Bearer' | tail -40
